# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: festdecor
      POSTGRES_PASSWORD: festdecor
      POSTGRES_DB: festdecor
    ports:
      - "5432:5432"
    volumes:
      - festdecor-db:/var/lib/postgresql/data
volumes:
  festdecor-db:
